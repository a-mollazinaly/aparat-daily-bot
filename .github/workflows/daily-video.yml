name: Daily Aparat Bot

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Chrome)
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python packages
        run: pip install moviepy==1.0.3 pillow edge-tts selenium webdriver-manager

      - name: Generate Video
        run: python generate_video.py

      - name: Upload to Aparat
        env:
          APARAT_USERNAME: ${{ secrets.APARAT_USERNAME }}
          APARAT_PASSWORD: ${{ secrets.APARAT_PASSWORD }}
        run: python upload_selenium.py

      - name: Upload video artifact (backup)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: daily-video
          path: output.mp4
