name: Daily Aparat Bot

on:
  schedule:
    - cron: '30 5 * * *'   # هر روز ساعت ۵:۳۰ صبح UTC (حدود ۹ صبح ایران)
  workflow_dispatch:        # دکمه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install packages
        run: pip install moviepy pillow gtts requests

      - name: Generate Video
        run: python generate_video.py

